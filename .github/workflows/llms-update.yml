name: Regenerate llms.txt

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "_posts/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-llms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Regenerate llms.txt
        run: python3 build_llms.py

      - name: Commit and push if changed
        run: |
          git config user.name  "gary23w"
          git config user.email "garystimpson03@gmail.com"
          git add llms.txt
          if git diff --cached --quiet; then
            echo "llms.txt unchanged — nothing to commit."
          else
            COUNT=$(grep -c '<DOCUMENT' llms.txt || true)
            git commit -m "chore(llms): regenerate corpus — ${COUNT} documents"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-llms
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
