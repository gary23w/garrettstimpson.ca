name: Regenerate llms.txt

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "_posts/**"
  workflow_dispatch:

concurrency:
  group: llms-update
  cancel-in-progress: false

jobs:
  build-llms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Regenerate llms.txt and llms-full.txt
        run: python3 build_llms.py

      - name: Commit and push if changed
        run: |
          git config user.name  "gary23w"
          git config user.email "info@garrettstimpson.ca"
          git add llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "llms files unchanged — nothing to commit."
          else
            COUNT=$(grep -c '<DOCUMENT' llms-full.txt || true)
            git commit -m "chore(llms): regenerate corpus — ${COUNT} documents"
            git pull --rebase origin main
            git push
          fi
