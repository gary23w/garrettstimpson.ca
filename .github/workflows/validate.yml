name: Keep Agent source private

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check search and sharing behavior
        run: node --test tests/experience.test.mjs
      - name: Reject Agent source in public history
        run: |
          if [ -n "$(git log --all --format=%H -- agent/ broker/)" ]; then
            echo "Agent Garrett source belongs in the private garrett repository."
            exit 1
          fi
