<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" role="img" aria-label="Step diagram of the Go Mirai variant from SSH entry through cpufreqd systemd persistence to C2-driven HTTP floods."><title>Step diagram of the Go Mirai variant from SSH entry through cpufreqd systemd persistence to C2-driven HTTP floods.</title><rect width="640" height="478" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Go Mirai variant hiding behind cpufreqd</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">SSH credential entry</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Credential brute forcing or a reused password (T1110)</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">systemd unit as cpufreqd</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Masquerades as a real Linux daemon; systemd runs it on</text><text x="78" y="234" fill="#c8d8c8" font-size="13">every boot</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Dial home to C2</text><text x="78" y="320" fill="#c8d8c8" font-size="13">Reaches its C2 over a web protocol and waits for flood</text><text x="78" y="338" fill="#c8d8c8" font-size="13">commands</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#ff2d55" stroke-opacity="0.7"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#ff2d55" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#ff2d55" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#ff8aa0" font-size="16" font-weight="700">fasthttp Layer 7 floods</text><text x="78" y="424" fill="#c8d8c8" font-size="13">directhttp and betterhttp commands ride on the fasthttp</text><text x="78" y="442" fill="#c8d8c8" font-size="13">library</text></g></svg>
