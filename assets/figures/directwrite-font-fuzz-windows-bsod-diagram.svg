<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img" aria-label="Diagram of the font fuzzing pipeline, from seed fonts and mutators through GDI harnesses to a KERNELBASE.dll overflow and bugcheck."><title>Diagram of the font fuzzing pipeline, from seed fonts and mutators through GDI harnesses to a KERNELBASE.dll overflow and bugcheck.</title><rect width="640" height="686" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Font fuzzing pipeline and crash chain</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">5 seed fonts</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Arial, Gabriola, Segoe UI and other TrueType seeds</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Mutators</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Three engines produce 2,000 .ttf files with structural</text><text x="78" y="234" fill="#c8d8c8" font-size="13">corruption</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Fuzz harnesses</text><text x="78" y="320" fill="#c8d8c8" font-size="13">DWrite, GDI and DWriteCore harnesses catch crashes via VEH</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">System-wide registration</text><text x="78" y="424" fill="#c8d8c8" font-size="13">AddFontResourceExW makes fontdrvhost.exe parse the fonts</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#00ff41" font-size="16" font-weight="700">Integer overflow</text><text x="78" y="528" fill="#c8d8c8" font-size="13">0xc0000095 in KERNELBASE.dll, called from fontdrvhost.exe</text><path d="M320.0 562 V578 M314.0 572 L320.0 579 L326.0 572" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="584" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="623.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="628.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="78" y="610" fill="#00ff41" font-size="16" font-weight="700">Bugcheck</text><text x="78" y="632" fill="#c8d8c8" font-size="13">SYSTEM_SERVICE_EXCEPTION (0x3B) twelve minutes into the</text><text x="78" y="650" fill="#c8d8c8" font-size="13">GDI bulk run</text></g></svg>
