<svg xmlns="http://www.w3.org/2000/svg" width="640" height="582" viewBox="0 0 640 582" role="img" aria-label="Step diagram of the Evelyn Stealer chain from a trojan VS Code extension through grpconv.exe hollowing to FTP exfiltration."><title>Step diagram of the Evelyn Stealer chain from a trojan VS Code extension through grpconv.exe hollowing to FTP exfiltration.</title><rect width="640" height="582" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Evelyn Stealer: VS Code extension to FTP exfil</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">Trojan VS Code extension</text><text x="78" y="112" fill="#c8d8c8" font-size="13">BigBlack extensions drop a downloader DLL named</text><text x="78" y="130" fill="#c8d8c8" font-size="13">Lightshot.dll on install</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Hidden PowerShell download</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Lightshot.dll launches hidden PowerShell that pulls down</text><text x="78" y="234" fill="#c8d8c8" font-size="13">runtime.exe</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Hollow grpconv.exe</text><text x="78" y="320" fill="#c8d8c8" font-size="13">runtime.exe decrypts the stealer (AES-256-CBC) and injects</text><text x="78" y="338" fill="#c8d8c8" font-size="13">it into grpconv.exe</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Steal creds and wallets</text><text x="78" y="424" fill="#c8d8c8" font-size="13">Cookies and credentials from Chrome and Edge, plus crypto</text><text x="78" y="442" fill="#c8d8c8" font-size="13">wallets</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#ff2d55" stroke-opacity="0.7"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#ff2d55" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#ff2d55" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#ff8aa0" font-size="16" font-weight="700">Zip and exfil over FTP</text><text x="78" y="528" fill="#c8d8c8" font-size="13">Zips the haul and ships it over FTP to</text><text x="78" y="546" fill="#c8d8c8" font-size="13">server09.mentality[.]cloud</text></g></svg>
