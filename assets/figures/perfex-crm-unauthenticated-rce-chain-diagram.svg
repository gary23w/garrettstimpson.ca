<svg xmlns="http://www.w3.org/2000/svg" width="640" height="582" viewBox="0 0 640 582" role="img" aria-label="Attack chain for Perfex CRM 3.4.x: blind SQLi, stolen reset token, admin takeover, PHP webshell upload, and RCE as www-data."><title>Attack chain for Perfex CRM 3.4.x: blind SQLi, stolen reset token, admin takeover, PHP webshell upload, and RCE as www-data.</title><rect width="640" height="582" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Perfex CRM 3.4.x: unauthenticated to RCE</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">SQLi in /migration/make</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Unauthenticated boolean blind SQLi via timing extracts the</text><text x="78" y="130" fill="#c8d8c8" font-size="13">admin email.</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Steal the reset token</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Trigger forgot_password, then extract the 32-char</text><text x="78" y="234" fill="#c8d8c8" font-size="13">new_pass_key.</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Take over the admin</text><text x="78" y="320" fill="#c8d8c8" font-size="13">Build the reset URL, change the admin password, log in.</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Upload a PHP webshell</text><text x="78" y="424" fill="#c8d8c8" font-size="13">No extension check in upload_sales_file; it lands in</text><text x="78" y="442" fill="#c8d8c8" font-size="13">uploads/newsfeed/.</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#ff2d55" stroke-opacity="0.7"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#ff2d55" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#ff2d55" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#ff8aa0" font-size="16" font-weight="700">RCE as www-data</text><text x="78" y="528" fill="#c8d8c8" font-size="13">Verify the shell with ?cmd=echo YUCA_OK, then run</text><text x="78" y="546" fill="#c8d8c8" font-size="13">arbitrary commands.</text></g></svg>
