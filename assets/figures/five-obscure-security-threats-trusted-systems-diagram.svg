<svg xmlns="http://www.w3.org/2000/svg" width="640" height="582" viewBox="0 0 640 582" role="img" aria-label="Key-points diagram of five attacks: WILD, Opossum, Download More RAM, Cuckoo, and x402, each crossing an unbound trust boundary."><title>Key-points diagram of five attacks: WILD, Opossum, Download More RAM, Cuckoo, and x402, each crossing an unbound trust boundary.</title><rect width="640" height="582" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Five threats almost nobody is watching yet</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">WILD: poison the map</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Forged beacons get real phones to poison crowd-sourced Wi-</text><text x="78" y="130" fill="#c8d8c8" font-size="13">Fi location data.</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Opossum: wrong response</text><text x="78" y="216" fill="#c8d8c8" font-size="13">TLS does not bind the channel to the conversation before</text><text x="78" y="234" fill="#c8d8c8" font-size="13">the handshake.</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Download More RAM</text><text x="78" y="320" fill="#c8d8c8" font-size="13">An 8 GB stick reports 16 GB: two addresses, one set of</text><text x="78" y="338" fill="#c8d8c8" font-size="13">DRAM cells.</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Cuckoo: stolen identity</text><text x="78" y="424" fill="#c8d8c8" font-size="13">A BACnet/SC certificate is not bound to the device&#x27;s UUID</text><text x="78" y="442" fill="#c8d8c8" font-size="13">or VMAC.</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#00ff41" font-size="16" font-weight="700">x402: verified, not settled</text><text x="78" y="528" fill="#c8d8c8" font-size="13">The merchant releases the resource after verify but before</text><text x="78" y="546" fill="#c8d8c8" font-size="13">a successful settle.</text></g></svg>
