<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img" aria-label="Six key points: mavinject DLL injection, a signed-binary kill chain, curl and tar, io_uring, eBPF hiding, and behavioral detection."><title>Six key points: mavinject DLL injection, a signed-binary kill chain, curl and tar, io_uring, eBPF hiding, and behavioral detection.</title><rect width="640" height="686" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Living off the land: techniques EDR still misses</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">MAVInject loads any DLL</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Microsoft-signed mavinject.exe injects a DLL into any</text><text x="78" y="130" fill="#c8d8c8" font-size="13">running process</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Signed binaries chain together</text><text x="78" y="216" fill="#c8d8c8" font-size="13">forfiles spawns cmd, which spawns mshta to run a remote</text><text x="78" y="234" fill="#c8d8c8" font-size="13">HTML Application</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">curl, tar, then a Run key</text><text x="78" y="320" fill="#c8d8c8" font-size="13">curl.exe and tar.exe drop the payload; reg.exe adds a Run</text><text x="78" y="338" fill="#c8d8c8" font-size="13">key</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">io_uring blinds Linux EDR</text><text x="78" y="424" fill="#c8d8c8" font-size="13">I/O happens in kernel context, without the transitions EDR</text><text x="78" y="442" fill="#c8d8c8" font-size="13">hooks catch</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#00ff41" font-size="16" font-weight="700">eBPF hides activity after root</text><text x="78" y="528" fill="#c8d8c8" font-size="13">With root or CAP_BPF, eBPF can conceal processes and</text><text x="78" y="546" fill="#c8d8c8" font-size="13">network connections</text><path d="M320.0 562 V578 M314.0 572 L320.0 579 L326.0 572" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="584" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="623.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="628.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="78" y="610" fill="#00ff41" font-size="16" font-weight="700">Behavioral baselining</text><text x="78" y="632" fill="#c8d8c8" font-size="13">Watch process chains, io_uring_enter, NTFS ADS paths and</text><text x="78" y="650" fill="#c8d8c8" font-size="13">BPF loads</text></g></svg>
