<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img" aria-label="Six-step diagram of the ClearFake Go DLL from a fake update and rundll32 launch through ntdll unhooking and sandbox exit."><title>Six-step diagram of the ClearFake Go DLL from a fake update and rundll32 launch through ntdll unhooking and sandbox exit.</title><rect width="640" height="686" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">ClearFake Go DLL execution and evasion chain</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">Fake browser update</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Compromised WordPress site serves a fake update or</text><text x="78" y="130" fill="#c8d8c8" font-size="13">reCAPTCHA overlay</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">rundll32 by ordinal #1</text><text x="78" y="216" fill="#c8d8c8" font-size="13">DLL in %LocalAppData%\Temp runs via signed rundll32,</text><text x="78" y="234" fill="#c8d8c8" font-size="13">export #1</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">TLS callback anti-debug</text><text x="78" y="320" fill="#c8d8c8" font-size="13">TLS callback fires before DllMain; NtClose(0xdeadc0de)</text><text x="78" y="338" fill="#c8d8c8" font-size="13">checks for a debugger</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Unhook ntdll via KnownDlls</text><text x="78" y="424" fill="#c8d8c8" font-size="13">Maps the clean \KnownDlls\ntdll.dll and unmaps the EDR-</text><text x="78" y="442" fill="#c8d8c8" font-size="13">hooked original</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#00ff41" font-size="16" font-weight="700">Dynamic API resolution</text><text x="78" y="528" fill="#c8d8c8" font-size="13">LdrGetProcedureAddressForCaller resolves thread hijacking</text><text x="78" y="546" fill="#c8d8c8" font-size="13">building blocks</text><path d="M320.0 562 V578 M314.0 572 L320.0 579 L326.0 572" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="584" width="592" height="78" rx="6" fill="#0a140a" stroke="#ff2d55" stroke-opacity="0.7"/><circle cx="50" cy="623.0" r="14" fill="none" stroke="#ff2d55" stroke-opacity="0.8"/><text x="50" y="628.0" fill="#ff2d55" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="78" y="610" fill="#ff8aa0" font-size="16" font-weight="700">Sandbox: clean exit</text><text x="78" y="632" fill="#c8d8c8" font-size="13">In CAPE it returned DLL_INIT_FAILED and contacted zero</text><text x="78" y="650" fill="#c8d8c8" font-size="13">hosts</text></g></svg>
