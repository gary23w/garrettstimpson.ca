<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" role="img" aria-label="Diagram of four embedded controller attack primitives: keystroke capture, SPI flash read/write, persistence and open debug ports."><title>Diagram of four embedded controller attack primitives: keystroke capture, SPI flash read/write, persistence and open debug ports.</title><rect width="640" height="478" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">Embedded controller attack primitives</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">Keystroke capture/injection</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Every key press goes through the EC; it can log or inject</text><text x="78" y="130" fill="#c8d8c8" font-size="13">keystrokes</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Main SPI flash read/write</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Read the UEFI firmware, inject a bootkit or SMM rootkit</text><text x="78" y="234" fill="#c8d8c8" font-size="13">into SPI flash</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Persistence</text><text x="78" y="320" fill="#c8d8c8" font-size="13">Survives OS reinstalls, BIOS reflash, CPU replacement and</text><text x="78" y="338" fill="#c8d8c8" font-size="13">TPM reset</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Debug ports left open</text><text x="78" y="424" fill="#c8d8c8" font-size="13">Unfused JTAG/SWD pins allow EC firmware dump and firmware</text><text x="78" y="442" fill="#c8d8c8" font-size="13">upload</text></g></svg>
