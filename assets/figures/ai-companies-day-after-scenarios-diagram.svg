<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" role="img" aria-label="Timeline diagram of the first 168 hours after a catastrophic AI event, from detection and silence to the settlement window."><title>Timeline diagram of the first 168 hours after a catastrophic AI event, from detection and silence to the settlement window.</title><rect width="640" height="478" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">The first 168 hours after a catastrophic AI event</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">Detection and silence</text><text x="78" y="112" fill="#c8d8c8" font-size="13">Hours 0 to 24: victims detect, lawyers convene, &quot;we are</text><text x="78" y="130" fill="#c8d8c8" font-size="13">aware of reports.&quot;</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">The blame market opens</text><text x="78" y="216" fill="#c8d8c8" font-size="13">Hours 24 to 72: race to name the model, the lab, the</text><text x="78" y="234" fill="#c8d8c8" font-size="13">customer.</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">The political auction</text><text x="78" y="320" fill="#c8d8c8" font-size="13">Hours 72 to 120: hearings, emergency briefings, calls for</text><text x="78" y="338" fill="#c8d8c8" font-size="13">moratoria.</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">The settlement window</text><text x="78" y="424" fill="#c8d8c8" font-size="13">Hours 120 to 168: liability, reporting mandates, release</text><text x="78" y="442" fill="#c8d8c8" font-size="13">freezes lock in.</text></g></svg>
