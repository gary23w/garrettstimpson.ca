<svg xmlns="http://www.w3.org/2000/svg" width="640" height="582" viewBox="0 0 640 582" role="img" aria-label="Five-step diagram of the GhostTouch attack, from a hidden antenna coupling into a touchscreen&#x27;s sense grid to injected taps on a connection request."><title>Five-step diagram of the GhostTouch attack, from a hidden antenna coupling into a touchscreen&#x27;s sense grid to injected taps on a connection request.</title><rect width="640" height="582" rx="8" fill="#050d05" stroke="#00ff41" stroke-opacity="0.22"/><g font-family="JetBrains Mono, Fira Code, Courier New, monospace"><text x="24" y="40" fill="#00ff41" font-size="19" font-weight="700">GhostTouch: EM field to injected tap</text><rect x="24" y="64" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="103.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="108.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="78" y="90" fill="#00ff41" font-size="16" font-weight="700">Hide a drive antenna</text><text x="78" y="112" fill="#c8d8c8" font-size="13">A small electrode under a desk, inside a phone stand or in</text><text x="78" y="130" fill="#c8d8c8" font-size="13">a charging pad</text><path d="M320.0 146 V162 M314.0 156 L320.0 163 L326.0 156" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="168" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="207.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="212.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="78" y="194" fill="#00ff41" font-size="16" font-weight="700">Drive a high-frequency signal</text><text x="78" y="216" fill="#c8d8c8" font-size="13">E.g. a 140 mm antenna at 46 MHz, far above the 100–500 kHz</text><text x="78" y="234" fill="#c8d8c8" font-size="13">excitation</text><path d="M320.0 250 V266 M314.0 260 L320.0 267 L326.0 260" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="272" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="311.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="316.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="78" y="298" fill="#00ff41" font-size="16" font-weight="700">Couple into the sense grid</text><text x="78" y="320" fill="#c8d8c8" font-size="13">Induced voltage on RX lines adds to the mutual capacitance</text><text x="78" y="338" fill="#c8d8c8" font-size="13">reading</text><path d="M320.0 354 V370 M314.0 364 L320.0 371 L326.0 364" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="376" width="592" height="78" rx="6" fill="#0a140a" stroke="#00ff41" stroke-opacity="0.35"/><circle cx="50" cy="415.0" r="14" fill="none" stroke="#00ff41" stroke-opacity="0.8"/><text x="50" y="420.0" fill="#00ff41" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="78" y="402" fill="#00ff41" font-size="16" font-weight="700">Controller sees a finger</text><text x="78" y="424" fill="#c8d8c8" font-size="13">The delta is indistinguishable from a grounded finger at</text><text x="78" y="442" fill="#c8d8c8" font-size="13">(x, y)</text><path d="M320.0 458 V474 M314.0 468 L320.0 475 L326.0 468" stroke="#00ff41" stroke-opacity="0.6" stroke-width="2" fill="none"/><rect x="24" y="480" width="592" height="78" rx="6" fill="#0a140a" stroke="#ff2d55" stroke-opacity="0.7"/><circle cx="50" cy="519.0" r="14" fill="none" stroke="#ff2d55" stroke-opacity="0.8"/><text x="50" y="524.0" fill="#ff2d55" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="78" y="506" fill="#ff8aa0" font-size="16" font-weight="700">Injected tap takes effect</text><text x="78" y="528" fill="#c8d8c8" font-size="13">E.g. tapping CONNECT on a Wi-Fi or Bluetooth request, or</text><text x="78" y="546" fill="#c8d8c8" font-size="13">answering a call</text></g></svg>
